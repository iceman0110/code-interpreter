ct x="212.3" y="189" width="150.4" height="23" rx="5" fill="#fff"/><text x="287.5" y="205" font-size="15" fill="#52657e" text-anchor="middle" font-weight="400">1. POST /v1/exec</text><polyline points="425,287 700,287" fill="none" stroke="#52657e" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="483.1" y="259" width="158.8" height="23" rx="5" fill="#fff"/><text x="562.5" y="275" font-size="15" fill="#52657e" text-anchor="middle" font-weight="400">2. queue.add(job)</text><polyline points="700,357 975,357" fill="none" stroke="#52657e" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="737.1" y="329" width="200.8" height="23" rx="5" fill="#fff"/><text x="837.5" y="345" font-size="15" fill="#52657e" text-anchor="middle" font-weight="400">3. worker consumes job</text><polyline points="975,427 1250,427" fill="none" stroke="#52657e" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="1007.9" y="399" width="209.20000000000002" height="23" rx="5" fill="#fff"/><text x="1112.5" y="415" font-size="15" fill="#52657e" text-anchor="middle" font-weight="400">4. POST /api/v2/execute</text><polyline points="1250,497 975,497" fill="none" stroke="#52657e" stroke-width="2.2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="970.1" y="469" width="284.8" height="23" rx="5" fill="#fff"/><text x="1112.5" y="485" font-size="15" fill="#52657e" text-anchor="middle" font-weight="400">5. result after upload + cleanup</text><polyline points="975,567 700,567" fill="none" stroke="#52657e" stroke-width="2.2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="711.9" y="539" width="251.20000000000002" height="23" rx="5" fill="#fff"/><text x="837.5" y="555" font-size="15" fill="#52657e" text-anchor="middle" font-weight="400">6. job completes with result</text><polyline points="700,637 425,637" fill="none" stroke="#52657e" stroke-width="2.2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="432.7" y="609" width="259.6" height="23" rx="5" fill="#fff"/><text x="562.5" y="62