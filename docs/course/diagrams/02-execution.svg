<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
<title id="title">One ordinary execution: the request and its response</title><desc id="desc">Time moves downward. File traffic is omitted here; the API waits while workers execute asynchronously.</desc>
