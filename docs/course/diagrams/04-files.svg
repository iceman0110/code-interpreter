<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="810" viewBox="0 0 1400 810" role="img" aria-labelledby="title desc">
<title id="title">The lifecycle of sales.csv and chart.png</title><desc id="desc">Numbered arrows are transfers. Object storage persists; the ordinary job workspace is temporary.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52657e"/></marker></defs>
<rect width="1400" height="810" fill="#fff"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="45" font-size="28" fill="#10213b" text-anchor="start" font-weight="700">The lifecycle of sales.csv and chart.png</text><text x="40" y="77" font-size="17" fill="#52657e" text-anchor="start" font-weight="400">Numbered arrows are transfers. Object storage persists; the ordinary job workspace is temporary.</text><g><rect x="45" y="150" width="250" height="100" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="63" y="182" font-size="20" fill="#18283f" text-anchor="start" font-weight="650">Caller / LibreChat</text><text x="63" y="211" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">Upload CSV; retain file ref</text><text x="63" y="235" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">Request execution; download</text></g><g><rect x="420" y="150" width="250" height="100" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="438" y="182" font-size="20" fill="#18283f" text-anchor="start" font-weight="650">Public API</text><text x="438" y="211" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">Authorize ownership</text><text x="438" y="235" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">Forward file operations</text></g><g><rect x="850" y="150" width="250" height="100" rx="14" fill="#e9f8f2" stroke="#087f5b" stroke-width="2"/><text x="868" y="182" font-size="20" fill="#18283f" text-anchor="start" font-weight="650">File server</text><text x="868" y="211" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">Resolve object identity</text><text x="868" y="235" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">Metadata and streaming</text></g><g><rect x="850" y="470" width="250" height="110" rx="14" fill="#e9f8f2" stroke="#087f5b" stroke-width="2"/><text x="868" y="502" font-size="20" fill="#18283f" text-anchor="start" font-weight="650">Object storage</text><text x="868" y="531" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">sales.csv input bytes</text><text x="868" y="555" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">chart.png output bytes</text></g><g><rect x="420" y="470" width="250" height="110" rx="14" fill="#fff5dd" stroke="#b67505" stroke-width="2"/><text x="438" y="502" font-size="20" fill="#18283f" text-anchor="start" font-weight="650">Egress gateway</text><text x="438" y="531" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">Scoped handles and grants</text><text x="438" y="555" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">Translate permitted requests</text></g><g><rect x="45" y="470" width="250" height="110" rx="14" fill="#fff0ee" stroke="#c6473a" stroke-width="2"/><text x="63" y="502" font-size="20" fill="#18283f" text-anchor="start" font-weight="650">Job workspace</text><text x="63" y="531" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">/mnt/data/sales.csv</text><text x="63" y="555" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">/mnt/data/chart.png</text></g><polyline points="295,180 420,180" fill="none" stroke="#52657e" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="313.4" y="147" width="83.2" height="23" rx="5" fill="#fff"/><text x="355" y="163" font-size="15" fill="#52657e" text-anchor="middle" font-weight="400">1 upload</text><polyline points="670,180 850,180" fill="none" stroke="#52657e" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="714.2" y="147" width="91.60000000000001" height="23" rx="5" fill="#fff"/><text x="760" y="163" font-size="15" fill="#52657e" text-anchor="middle" font-weight="400">2 forward</text><polyline points="1030,250 1030,470" fill="none" stroke="#52657e" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="1047.4" y="339" width="125.2" height="23" rx="5" fill="#fff"/><text x="1110" y="355" font-size="15" fill="#52657e" text-anchor="middle" font-weight="400">3 persist CSV</text><polyline points="850,550 670,550" fill="none" stroke="#52657e" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="697.4" y="517" width="125.2" height="23" rx="5" fill="#fff"/><text x="760" y="533" font-size="15" fill="#52657e" text-anchor="middle" font-weight="400">4 fetch input</text><polyline points="420,550 295,550" fill="none" stroke="#52657e" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="317.6" y="517" width="74.80000000000001" height="23" rx="5" fill="#fff"/><text x="355" y="533" font-size="15" fill="#52657e" text-anchor="middle" font-weight="400">5 prime</text><polyline points="295,490 420,490" fill="none" stroke="#52657e" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="288.2" y="457" width="133.60000000000002" height="23" rx="5" fill="#fff"/><text x="355" y="473" font-size="15" fill="#52657e" text-anchor="middle" font-weight="400">6 chart output</text><polyline points="600,470 600,340 940,340 940,250" fill="none" stroke="#52657e" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="666.2" y="307" width="217.60000000000002" height="23" rx="5" fill="#fff"/><text x="775" y="323" font-size="15" fill="#52657e" text-anchor="middle" font-weight="400">7 upload via file server</text><polyline points="1100,195 1290,195 1290,660 15,660 15,225 45,225" fill="none" stroke="#52657e" stroke-width="2.2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="515.2" y="627" width="469.6" height="23" rx="5" fill="#fff"/><text x="750" y="643" font-size="15" fill="#52657e" text-anchor="middle" font-weight="400">8 later download: storage → file server → API → caller</text><text x="45" y="720" font-size="16" fill="#52657e" text-anchor="start" font-weight="400">Arrow 8 summarizes a separate authorized download and returns to the caller, independently of the job workspace.</text><text x="45" y="750" font-size="16" fill="#52657e" text-anchor="start" font-weight="400">The API returns references after successful delivery. Input references can retain an earlier storage_session_id.</text>
<text x="40" y="790" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">Code Interpreter course | Source snapshot 2fa9f0d | Arrows are labeled by purpose</text></g></svg>
