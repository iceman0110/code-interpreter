<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
<title id="title">Functions that cooperate on an ordinary execution</title><desc id="desc">Rows are lifecycle stages. Arrows show control handoff; callbacks and library methods are named explicitly.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52657e"/></marker></defs>
<rect width="1400" height="1000" fill="#fff"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="45" font-size="28" fill="#10213b" text-anchor="start" font-weight="700">Functions that cooperate on an ordinary execution</text><text x="40" y="77" font-size="17" fill="#52657e" text-anchor="start" font-weight="400">Rows are lifecycle stages. Arrows show control handoff; callbacks and library methods are named explicitly.</text><rect x="30" y="110" width="1335" height="190" rx="18" fill="#eaf2ff" fill-opacity="0.42" stroke="#2563eb" stroke-dasharray="8 6"/><text x="48" y="140" font-size="18" fill="#2563eb" text-anchor="start" font-weight="650">1 | Public request preparation</text><g><rect x="55" y="158" width="285" height="108" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="73" y="190" font-size="20" fill="#18283f" text-anchor="start" font-weight="650">/v1/exec handler</text><text x="73" y="219" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">authorizeRequestedFiles()</text><text x="73" y="243" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">recordSessionOwnership()</text></g><g><rect x="400" y="158" width="285" height="108" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="418" y="190" font-size="20" fill="#18283f" text-anchor="start" font-weight="650">createPayload()</text><text x="418" y="219" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">Runtime + source + inputs</text><text x="418" y="243" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">Memory / arguments</text></g><g><rect x="745" y="158" width="285" height="108" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="763" y="190" font-size="20" fill="#18283f" text-anchor="start" font-weight="650">prepareSandboxJobSecurity</text><text x="763" y="219" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">Execution and egress claims</text><text x="763" y="243" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">Before signing</text></g><g><rect x="1090" y="158" width="245" height="108" rx="14" fill="#f2edff" stroke="#7451bd" stroke-width="2"/><text x="1108" y="190" font-size="20" fill="#18283f" text-anchor="start" font-weight="650">queue.add()</text><text x="1108" y="219" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">BullMQ library method</text><text x="1108" y="243" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">API waits for completion</text></g><polyline points="340,210 400,210" fill="none" stroke="#52657e" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="685,210 745,210" fill="none" stroke="#52657e" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="1030,210 1090,210" fill="none" stroke="#52657e" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="30" y="330" width="1335" height="190" rx="18" fill="#f2edff" fill-opacity="0.42" stroke="#7451bd" stroke-dasharray="8 6"/><text x="48" y="360" font-size="18" fill="#7451bd" text-anchor="start" font-weight="650">2 | Worker callback and backend dispatch</text><g><rect x="55" y="378" width="285" height="108" rx="14" fill="#f2edff" stroke="#7451bd" stroke-width="2"/><text x="73" y="410" font-size="20" fill="#18283f" text-anchor="start" font-weight="650">processJobInner()</text><text x="73" y="439" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">Deadline + profile checks</text><text x="73" y="463" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">Gateway grant preparation</text></g><g><rect x="400" y="378" width="285" height="108" rx="14" fill="#f2edff" stroke="#7451bd" stroke-width="2"/><text x="418" y="410" font-size="20" fill="#18283f" text-anchor="start" font-weight="650">buildSandboxExecuteRequest</text><text x="418" y="439" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">Bind and sign request body</text><text x="418" y="463" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">Transport headers</text></g><g><rect x="745" y="378" width="285" height="108" rx="14" fill="#f2edff" stroke="#7451bd" stroke-width="2"/><text x="763" y="410" font-size="20" fill="#18283f" text-anchor="start" font-weight="650">getSandboxBackend()</text><text x="763" y="439" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">Select http / lambda / bridge</text><text x="763" y="463" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">execute(request, context)</text></g><g><rect x="1090" y="378" width="245" height="108" rx="14" fill="#f2edff" stroke="#7451bd" stroke-width="2"/><text x="1108" y="410" font-size="20" fill="#18283f" text-anchor="start" font-weight="650">HTTP backend</text><text x="1108" y="439" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">axios.post()</text><text x="1108" y="463" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">/api/v2/execute</text></g><polyline points="1212,266 1212,314 197,314 197,378" fill="none" stroke="#52657e" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="340,430 400,430" fill="none" stroke="#52657e" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="685,430 745,430" fill="none" stroke="#52657e" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="1030,430 1090,430" fill="none" stroke="#52657e" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="30" y="550" width="1335" height="190" rx="18" fill="#fff0ee" fill-opacity="0.42" stroke="#c6473a" stroke-dasharray="8 6"/><text x="48" y="580" font-size="18" fill="#c6473a" text-anchor="start" font-weight="650">3 | Runner handler and per-job lifecycle</text><g><rect x="55" y="598" width="285" height="108" rx="14" fill="#fff0ee" stroke="#c6473a" stroke-width="2"/><text x="73" y="630" font-size="20" fill="#18283f" text-anchor="start" font-weight="650">verify + getJob()</text><text x="73" y="659" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">Manifest and input checks</text><text x="73" y="683" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">Construct execution Job</text></g><g><rect x="400" y="598" width="285" height="108" rx="14" fill="#fff0ee" stroke="#c6473a" stroke-width="2"/><text x="418" y="630" font-size="20" fill="#18283f" text-anchor="start" font-weight="650">Job.prime()</text><text x="418" y="659" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">Prepare workspace and files</text><text x="418" y="683" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">Download authorized inputs</text></g><g><rect x="745" y="598" width="285" height="108" rx="14" fill="#fff0ee" stroke="#c6473a" stroke-width="2"/><text x="763" y="630" font-size="20" fill="#18283f" text-anchor="start" font-weight="650">Job.execute()</text><text x="763" y="659" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">safeCall() → nsjail.execute()</text><text x="763" y="683" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">Compile/run; inspect outputs</text></g><g><rect x="1090" y="598" width="245" height="108" rx="14" fill="#fff0ee" stroke="#c6473a" stroke-width="2"/><text x="1108" y="630" font-size="20" fill="#18283f" text-anchor="start" font-weight="650">Upload + cleanup</text><text x="1108" y="659" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">uploadGeneratedFiles()</text><text x="1108" y="683" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">reconcile → cleanup()</text></g><polyline points="1212,486 1212,534 197,534 197,598" fill="none" stroke="#52657e" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="340,650 400,650" fill="none" stroke="#52657e" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="685,650 745,650" fill="none" stroke="#52657e" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="1030,650 1090,650" fill="none" stroke="#52657e" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="1212,706 1212,805 770,805" fill="none" stroke="#52657e" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="877.6" y="771" width="284.8" height="23" rx="5" fill="#fff"/><text x="1020" y="787" font-size="15" fill="#52657e" text-anchor="middle" font-weight="400">return through worker and BullMQ</text><g><rect x="375" y="775" width="395" height="107" rx="14" fill="#e9f8f2" stroke="#087f5b" stroke-width="2"/><text x="393" y="807" font-size="20" fill="#18283f" text-anchor="start" font-weight="650">Waiting API replies to caller</text><text x="393" y="836" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">Result normalization happens in worker</text><text x="393" y="860" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">Private helpers are not public endpoints</text></g><text x="45" y="939" font-size="16" fill="#52657e" text-anchor="start" font-weight="400">Names without () in narrow boxes are still function names. Full signatures and source locations are in the function atlas.</text>
