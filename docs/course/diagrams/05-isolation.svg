<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
<title id="title">Where execution runs in KVM mode</title><desc id="desc">A long-lived runner can handle multiple jobs. Fresh process/workspace isolation remains necessary inside its guest.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52657e"/></marker></defs>
<rect width="1400" height="860" fill="#fff"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="45" font-size="28" fill="#10213b" text-anchor="start" font-weight="700">Where execution runs in KVM mode</text><text x="40" y="77" font-size="17" fill="#52657e" text-anchor="start" font-weight="400">A long-lived runner can handle multiple jobs. Fresh process/workspace isolation remains necessary inside its guest.</text><rect x="45" y="115" width="1030" height="640" rx="18" fill="#f1f4f8" fill-opacity="0.42" stroke="#64748b" stroke-dasharray="8 6"/><text x="63" y="145" font-size="18" fill="#64748b" text-anchor="start" font-weight="650">Dedicated Linux node / Azure VM (proposed AKS runner pool)</text><rect x="80" y="175" width="960" height="540" rx="18" fill="#eaf2ff" fill-opacity="0.42" stroke="#2563eb" stroke-dasharray="8 6"/><text x="98" y="205" font-size="18" fill="#2563eb" text-anchor="start" font-weight="650">Sandbox-runner Pod / container</text><g><rect x="115" y="230" width="870" height="85" rx="14" fill="#f2edff" stroke="#7451bd" stroke-width="2"/><text x="133" y="262" font-size="20" fill="#18283f" text-anchor="start" font-weight="650">libkrun launcher + /dev/kvm</text><text x="133" y="291" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">Host-side VM execution; separate guest kernel</text></g><rect x="115" y="350" width="870" height="325" rx="18" fill="#fff0ee" fill-opacity="0.42" stroke="#c6473a" stroke-dasharray="8 6"/><text x="133" y="380" font-size="18" fill="#c6473a" text-anchor="start" font-weight="650">MicroVM guest: runner HTTP service + NsJail execution</text><g><rect x="150" y="410" width="380" height="195" rx="14" fill="#fff0ee" stroke="#c6473a" stroke-width="2"/><text x="168" y="442" font-size="20" fill="#18283f" text-anchor="start" font-weight="650">Job A: NsJail</text><text x="168" y="471" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">Distinct workspace and job identity</text><text x="168" y="495" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">Bounded language process</text><text x="168" y="519" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">Input CSV → output chart</text><text x="168" y="543" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">Cleanup after artifact upload</text></g><g><rect x="565" y="410" width="380" height="195" rx="14" fill="#fff0ee" stroke="#c6473a" stroke-width="2"/><text x="583" y="442" font-size="20" fill="#18283f" text-anchor="start" font-weight="650">Job B: NsJail</text><text x="583" y="471" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">Independent workspace / identity</text><text x="583" y="495" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">Separate concurrent execution</text><text x="583" y="519" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">No automatic Python state sharing</text><text x="583" y="543" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">Same guest, separate job boundary</text></g><g><rect x="1120" y="260" width="245" height="135" rx="14" fill="#fff5dd" stroke="#b67505" stroke-width="2"/><text x="1138" y="292" font-size="20" fill="#18283f" text-anchor="start" font-weight="650">Runner receives</text><text x="1138" y="321" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">Manifest public verifier</text><text x="1138" y="345" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">Scoped egress grant</text><text x="1138" y="369" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">Runtime configuration</text></g><g><rect x="1120" y="470" width="245" height="165" rx="14" fill="#e9f8f2" stroke="#087f5b" stroke-width="2"/><text x="1138" y="502" font-size="20" fill="#18283f" text-anchor="start" font-weight="650">Kept outside runner</text><text x="1138" y="531" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">Storage credentials / identity</text><text x="1138" y="555" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">Redis password</text><text x="1138" y="579" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">Manifest private key</text><text x="1138" y="603" font-size="16" fill="#18283f" text-anchor="start" font-weight="400">Gateway encryption secret</text></g><text x="65" y="800" font-size="16" fill="#52657e" text-anchor="start" font-weight="400">Direct NsJail mode removes the microVM guest-kernel layer. It is a different isolation configuration, not an Azure shortcut.</text>
<text x="40" y="840" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">Code Interpreter course | Source snapshot 2fa9f0d | Arrows are labeled by purpose</text></g></svg>
